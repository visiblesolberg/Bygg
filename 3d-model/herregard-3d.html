<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D-modell – plan (LillesandHus)</title>
<style>
  :root { --krem:#F7F4EC; --koks:#2B2B2B; --salvie:#6E7F6A; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:"Segoe UI",system-ui,sans-serif; background:var(--krem); color:var(--koks); }
  #app { position:fixed; inset:0; }
  .panel { position:fixed; top:16px; left:16px; z-index:10; background:rgba(247,244,236,.92);
    backdrop-filter:blur(6px); border:1px solid #e3ddcf; border-radius:18px; padding:16px 18px;
    box-shadow:0 8px 28px rgba(43,43,43,.12); max-width:290px; }
  .panel h1 { font-size:16px; margin:0 0 2px; }
  .panel p { font-size:12px; margin:0 0 12px; color:#6b6b6b; line-height:1.4; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  button { font:inherit; font-size:13px; cursor:pointer; border:1px solid #d6cfbf; background:#fff;
    color:var(--koks); border-radius:999px; padding:8px 14px; transition:all .15s; }
  button:hover { border-color:var(--salvie); }
  button.active { background:var(--salvie); color:#fff; border-color:var(--salvie); }
  button.primary { background:var(--salvie); color:#fff; border-color:var(--salvie); width:100%; margin-top:10px; padding:10px; font-weight:600; }
  .hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:10; font-size:12px;
    color:#7a7a7a; background:rgba(247,244,236,.85); padding:6px 14px; border-radius:999px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="panel">
  <h1>3D-modell av planen</h1>
  <p>Vegglinjer hentet fra 2D-tegningen og «reist» i 3D, med trapp i Hall/trapp og Gang/trapp. Dra=roter · scroll=zoom · høyreklikk=panorer.</p>
  <div class="row">
    <button id="btnRoof" class="active">Tak</button>
    <button id="btnUpper" class="active">2. etasje</button>
    <button id="btnLabels" class="active">Romnavn</button>
    <button id="btnReset">Tilbakestill</button>
  </div>
  <button id="btnExport" class="primary">⬇ Last ned 3D-fil (.glb)</button>
</div>
<div class="hint">Slå av «Tak» og «2. etasje» for å se planløsningen ovenfra</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

// ===========================================================================
// GEOMETRI TRACET FRA 2D-PLANEN (meter). X = høyre, Z = ned (nord opp).
// Koordinatene er lest av tegningen for hånd – formen følger planen,
// absolutte mål er tilnærmet (ingen målsatt skala i bildet).
// ===========================================================================
const H1 = 2.6, SLAB = 0.3, H2 = 2.5;
const Y2 = H1 + SLAB;          // gulvnivå 2. etasje
const ROOF_BASE = Y2 + H2;     // takfot
const WT = 0.16;               // veggtykkelse

// ---- 1. ETASJE -------------------------------------------------------------
// Ytterkontur (med garasje-fløy på toppen og inngangskarnapp nederst)
const OUT1 = [
  [3.2,0],[8.4,0],[8.4,4.2],[12.2,4.2],[12.2,14.2],
  [7.4,14.2],[7.4,15.0],[4.6,15.0],[4.6,14.2],[0,14.2],[0,4.2],[3.2,4.2]
];
// Innervegger (segmenter [x1,z1,x2,z2])
const WALLS1 = [
  // garasje / bod
  [6.2,0,6.2,4.2],[6.2,3.0,8.4,3.0],
  // skille garasjefløy ↔ resten
  [3.2,4.2,8.4,4.2],
  // mellomsone: gang / sluse / wc / teknisk
  [4.8,4.2,4.8,8.4],[2.4,5.6,4.8,5.6],[2.4,5.6,2.4,8.4],
  [7.0,4.2,7.0,7.0],[7.0,5.5,8.5,5.5],[4.9,6.4,7.0,6.4],
  // hovedskille mot nedre del
  [0,8.4,12.2,8.4],
  // bad/wc/vask + matbod
  [2.5,8.4,2.5,11.8],[0,11.8,2.5,11.8],
  [2.6,8.4,2.6,9.8],[2.6,9.8,3.9,9.8],[3.9,8.4,3.9,9.8],
  // hall/trapp + ekstra soverom
  [4.0,8.4,4.0,12.0],[6.8,8.4,6.8,12.0],[4.0,12.0,9.9,12.0],[9.9,8.4,9.9,12.0],
  // kjøkken/allrom vs stue (delvis)
  [4.3,12.0,4.3,14.2],
];
// Rom (kun for gulvflis + etikett): [navn, areal, cx, cz]
const ROOMS1 = [
  ["Garasje",20.3,4.7,2.0],["Bod",6.6,7.3,1.5],
  ["Gang",6.9,3.6,7.0],["Sluse/Bod",6.3,5.9,5.3],["WC",2.1,7.8,4.8],["Teknisk",2.0,7.8,6.2],
  ["Bad/WC/Vask",8.5,1.2,10.0],["Matbod",2.1,3.25,9.0],
  ["Hall/trapp",11.4,5.4,10.2],["Ekstra soverom",11.3,8.4,10.2],
  ["Kjøkken/allrom",25.6,2.1,13.0],["Stue",35.2,8.2,13.0],
];
const STAIRS1 = { x:4.9, z:11.6, width:1.0, axis:"z", sign:-1, rise:Y2, run:3.0 };

// ---- 2. ETASJE -------------------------------------------------------------
const OUT2 = [
  [1.0,4.5],[11.4,4.5],[11.4,13.6],[8.4,13.6],[7.4,15.0],[4.6,15.0],[3.6,13.6],[1.0,13.6]
];
const WALLS2 = [
  // master + tv-stue (øvre del)
  [3.4,4.5,3.4,8.6],[8.0,4.5,8.0,8.6],[8.0,8.6,11.4,8.6],
  // midtskille
  [1.0,8.6,11.4,8.6],
  // bad/wc, gang/trapp, soverom (h)
  [3.4,8.6,3.4,13.6],[6.0,8.6,6.0,12.0],[8.4,8.6,8.4,13.6],
  [6.0,12.0,8.4,12.0],
  // nedre venstre soverom + loftstue
  [3.4,11.4,6.0,11.4],
];
const ROOMS2 = [
  ["Soverom",18.1,5.7,6.3],["TV-stue",14.6,9.7,6.6],["Krypbod (kald)",0,2.1,6.5],
  ["Bad/WC",11.3,4.7,10.0],["Gang/trapp",11.9,7.2,10.2],["Soverom",12.3,9.9,10.0],
  ["Soverom",11.0,2.1,12.5],["Loftstue",13.9,4.7,12.7],["Soverom",11.6,9.9,12.8],
];
// Trappeåpning/repos i 2. etg (toppen av samme trapp)
const STAIRS2 = null;

// ===========================================================================
// THREE-OPPSETT
// ===========================================================================
const all = [...OUT1, ...OUT2];
const minX=Math.min(...all.map(p=>p[0])), maxX=Math.max(...all.map(p=>p[0]));
const minZ=Math.min(...all.map(p=>p[1])), maxZ=Math.max(...all.map(p=>p[1]));
const cx=(minX+maxX)/2, cz=(minZ+maxZ)/2, fW=maxX-minX, fD=maxZ-minZ;

const app=document.getElementById("app");
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene(); scene.background=new THREE.Color(0xeef1ea);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,1000);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
const CAM0=new THREE.Vector3(cx+Math.max(fW,fD)*1.05,15,maxZ+fD*0.85+5);
function resetView(){ camera.position.copy(CAM0); controls.target.set(cx,1.5,cz); controls.update(); }
resetView();

scene.add(new THREE.HemisphereLight(0xffffff,0x9fb0a0,0.9));
const sun=new THREE.DirectionalLight(0xfff4e0,1.5);
sun.position.set(cx-14,28,minZ-12); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
const s=Math.max(fW,fD)*1.3;
Object.assign(sun.shadow.camera,{left:-s,right:s,top:s,bottom:-s,near:1,far:90}); scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(140,140),
  new THREE.MeshStandardMaterial({color:0xdfe6da,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.position.set(cx,-0.02,cz); ground.receiveShadow=true; scene.add(ground);

const matWall=new THREE.MeshStandardMaterial({color:0xf3efe6,roughness:0.92});
const matF1=new THREE.MeshStandardMaterial({color:0xc9b79c,roughness:0.85});
const matF2=new THREE.MeshStandardMaterial({color:0xd8cab2,roughness:0.85});
const matRoof=new THREE.MeshStandardMaterial({color:0xb14b3a,roughness:0.7});
const matStep=new THREE.MeshStandardMaterial({color:0xbda782,roughness:0.8});

const model=new THREE.Group(); scene.add(model);
const gF1=new THREE.Group(), gF2=new THREE.Group(), gRoof=new THREE.Group();
model.add(gF1,gF2,gRoof);
const gLabels=new THREE.Group(); scene.add(gLabels);

// --- helpers ---
function wallSeg(group,x1,z1,x2,z2,h,baseY){
  const dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz)+WT;
  const m=new THREE.Mesh(new THREE.BoxGeometry(len,h,WT),matWall);
  m.position.set((x1+x2)/2,baseY+h/2,(z1+z2)/2);
  m.rotation.y=-Math.atan2(dz,dx);
  m.castShadow=true; m.receiveShadow=true; group.add(m);
}
function outlineWalls(group,outline,h,baseY){
  for(let i=0;i<outline.length;i++){
    const a=outline[i], b=outline[(i+1)%outline.length];
    wallSeg(group,a[0],a[1],b[0],b[1],h,baseY);
  }
}
function slab(group,outline,y,mat){
  const sh=new THREE.Shape();
  sh.moveTo(outline[0][0],outline[0][1]);
  for(let i=1;i<outline.length;i++) sh.lineTo(outline[i][0],outline[i][1]);
  sh.closePath();
  const g=new THREE.ExtrudeGeometry(sh,{depth:0.08,bevelEnabled:false});
  g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,mat); m.position.y=y; m.receiveShadow=true; group.add(m);
}
function stairs(group,st,baseY){
  if(!st) return;
  const n=Math.max(8,Math.round(st.rise/0.18)), rh=st.rise/n, tr=st.run/n;
  for(let i=0;i<n;i++){
    const stp=new THREE.Mesh(new THREE.BoxGeometry(
      st.axis==="z"?st.width:tr, rh, st.axis==="z"?tr:st.width), matStep);
    const prog=i*tr*st.sign, y=baseY+rh/2+i*rh;
    if(st.axis==="z") stp.position.set(st.x, y, st.z+prog);
    else stp.position.set(st.x+prog, y, st.z);
    stp.castShadow=true; stp.receiveShadow=true; group.add(stp);
  }
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function label(text,sub,x,y,z){
  const c=document.createElement("canvas"); c.width=256; c.height=128; const ctx=c.getContext("2d");
  ctx.fillStyle="rgba(43,43,43,.82)"; roundRect(ctx,8,30,240,68,16); ctx.fill();
  ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.font="600 30px Segoe UI,sans-serif"; ctx.fillText(text,128,66);
  if(sub){ctx.font="22px Segoe UI,sans-serif"; ctx.fillStyle="#d7ddd2"; ctx.fillText(sub,128,92);}
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex})); sp.scale.set(2.3,1.15,1);
  sp.position.set(x,y,z); gLabels.add(sp);
}

// --- bygg 1. etasje ---
slab(gF1,OUT1,0,matF1);
outlineWalls(gF1,OUT1,H1,0);
WALLS1.forEach(w=>wallSeg(gF1,w[0],w[1],w[2],w[3],H1,0));
stairs(gF1,STAIRS1,0);
ROOMS1.forEach(r=>label(r[0], r[1]?r[1].toFixed(1)+" m²":"", r[2], H1+0.45, r[3]));

// --- bygg 2. etasje ---
slab(gF2,OUT2,Y2-0.08,matF2);
outlineWalls(gF2,OUT2,H2,Y2);
WALLS2.forEach(w=>wallSeg(gF2,w[0],w[1],w[2],w[3],H2,Y2));
stairs(gF2,STAIRS2,Y2);
ROOMS2.forEach(r=>label(r[0], r[1]?r[1].toFixed(1)+" m²":"", r[2], Y2+H2+0.45, r[3]));

// --- tak (valmtak over hovedkroppen) ---
(function(){
  const over=0.7, w=fW+over*2, d=fD+over*2;
  const g=new THREE.ConeGeometry(Math.SQRT1_2,1,4,1); g.rotateY(Math.PI/4);
  const roof=new THREE.Mesh(g,matRoof); roof.scale.set(w,2.8,d);
  roof.position.set(cx,ROOF_BASE+1.4,cz); roof.castShadow=true; gRoof.add(roof);
  const band=new THREE.Mesh(new THREE.BoxGeometry(w,0.25,d),
    new THREE.MeshStandardMaterial({color:0xece7db,roughness:1}));
  band.position.set(cx,ROOF_BASE+0.12,cz); gRoof.add(band);
})();

// ===========================================================================
// UI
// ===========================================================================
const tog=(id,grp,sib)=>document.getElementById(id).addEventListener("click",e=>{
  grp.visible=!grp.visible; e.target.classList.toggle("active",grp.visible);
  if(sib){ sib.visible=grp.visible; }
});
tog("btnRoof",gRoof);
document.getElementById("btnUpper").addEventListener("click",e=>{
  const v=!gF2.visible; gF2.visible=v; e.target.classList.toggle("active",v);
});
document.getElementById("btnLabels").addEventListener("click",e=>{
  const v=!gLabels.visible; gLabels.visible=v; e.target.classList.toggle("active",v);
});
document.getElementById("btnReset").addEventListener("click",resetView);
document.getElementById("btnExport").addEventListener("click",()=>{
  new GLTFExporter().parse(model,glb=>{
    const b=new Blob([glb],{type:"model/gltf-binary"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="hus-modell.glb"; a.click();
    URL.revokeObjectURL(a.href);
  },err=>alert("Eksport feilet: "+err),{binary:true});
});

addEventListener("resize",()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
